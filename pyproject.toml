[project]
name = "mcp-zenodo"
version = "0.1.0"
description = "Zenodo tools for large language models over MCP and HTTP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.11.18",
    "fastapi>=0.115.12",
    "mcp[cli]>=1.6.0,<2",
    "pydantic>=2.11.3",
    "python-dotenv>=1.1.0",
    "uvicorn>=0.34.2",
    "yarl>=1.20.0",
]
